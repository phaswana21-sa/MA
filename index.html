<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MA • Mzansi Assistance 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--border:rgba(255,215,0,0.25);--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,0.68),rgba(0,0,0,0.88)),url('background.jpg') center/cover no-repeat;z-index:-1;filter:brightness(0.9)}
h1{font-family:'Space Grotesk';letter-spacing:4px;color:var(--gold);text-shadow:0 0 20px gold;margin-top:10px;font-size:28px}
.sub{font-size:10px;letter-spacing:3px;color:gold;opacity:0.8;margin-bottom:12px;text-align:center}
.glass{background:rgba(15,15,15,0.88);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
.topbar{width:100%;max-width:430px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-weight:600;font-size:12px;padding:11px 18px;border-radius:30px;border:none;cursor:pointer;transition:0.2s}
.btn:active{transform:scale(0.96)}
.gold{background:linear-gradient(135deg,#FFD700,#FFC300);color:#000;box-shadow:0 0 12px rgba(255,215,0,0.4)}
.dark{background:rgba(255,255,255,0.08);color:gold;border:1px solid var(--border)}
.red{background:#D32F2F;color:#fff;box-shadow:0 0 12px rgba(211,47,47,0.4)}
select{width:100%;padding:12px;border-radius:14px;background:#0e0e0e;color:gold;border:1px solid var(--border);font-weight:600;outline:none}
#chat{width:100%;max-width:430px;height:470px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;margin:8px 0;background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.78)),url('background.jpg') center/cover no-repeat;background-attachment:local;border:1px solid rgba(255,215,0,0.22);box-shadow:inset 0 0 80px rgba(0,0,0,0.9)}
#chat::-webkit-scrollbar{width:4px}#chat::-webkit-scrollbar-thumb{background:gold;border-radius:10px}
.msg{max-width:86%;padding:13px 16px;border-radius:20px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;animation:pop 0.2s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.user{align-self:flex-end;background:linear-gradient(135deg,#FFD700,#FFC300);color:#000;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:rgba(22,22,22,0.94);color:#FFE57F;border:1px solid rgba(255,215,0,0.22);border-bottom-left-radius:6px;backdrop-filter:blur(8px)}
.inputBar{width:100%;max-width:430px;display:flex;gap:8px;padding:10px 12px;margin:6px 0}
#q{flex:1;padding:14px 18px;border-radius:28px;border:1px solid var(--border);background:#0e0e0e;color:#fff;outline:none;font-size:14px}
#apiBox{display:none;width:100%;padding:12px;border-radius:14px;background:rgba(0,0,0,0.82);border:1px dashed gold}
#apiBox input{width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid var(--border);margin:6px 0;outline:none}
.statusDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.online{background:#00E676;box-shadow:0 0 8px #00E676}.offline{background:#FF5252}
.support{width:100%;max-width:430px;text-align:center;margin:10px;padding:12px}
.support b{color:gold}
</style>
</head>
<body>
<h1>MA • MZANSI</h1>
<div class="sub">BUILT FROM DUST • POWERED BY DREAMS • 2026</div>

<div class="topbar glass">
<div style="display:flex;justify-content:space-between;font-size:11px;align-items:center"><span><span id="dot" class="statusDot offline"></span><span id="statusText">Local Brain</span></span><span id="langLabel">ENGLISH</span></div>
<select id="lang"><option value="en">🌍 English</option><option value="ve">🇿🇦 Tshivenda</option><option value="zu">🇿🇦 IsiZulu</option><option value="xh">🇿🇦 IsiXhosa</option><option value="st">🇿🇦 Sesotho</option></select>
<div class="row"><button class="btn gold" id="installBtn">⬇️ INSTALL APP</button><button class="btn dark" onclick="shareApp()">📤 SHARE</button><button class="btn red" id="wakeBtn" onclick="toggleWake()">🎤 HEY MA</button></div>
<div class="row"><button class="btn dark" onclick="toggleApiBox()">🧠 CONNECT AI BRAIN</button><button class="btn dark" onclick="clearChat()">🧹 CLEAR</button></div>
<div id="apiBox">
<div style="font-size:12px;color:gold;margin-bottom:6px">Get FREE Groq key: groq.com → API Keys → Create (gsk_...)</div>
<input id="apiKey" type="password" placeholder="Paste gsk_... key here">
<div class="row"><button class="btn gold" onclick="saveKey()">💾 SAVE</button><button class="btn dark" onclick="testBrain()">🧪 TEST</button><button class="btn dark" onclick="removeKey()">❌ REMOVE</button></div>
<div id="apiMsg" style="font-size:11px;color:#00E676;margin-top:8px"></div>
</div>
</div>

<div id="chat" class="glass"></div>

<div class="inputBar glass"><input id="q" placeholder="Ask MA anything..."><button class="btn gold" style="border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center" onclick="ask()">➤</button></div>

<div class="support glass"><div style="color:gold;font-weight:700;font-size:13px">☕ Support Creator</div><div style="font-size:11px;margin-top:4px">Mulweli Phaswana • Capitec: <b>2225840055</b></div><div style="font-size:9px;opacity:0.6;margin-top:4px">KASI BOY BUILT FROM DUST, POWERED BY DREAMS</div></div>

<script>
let lang='en', lastBot='', heyOn=false, wakeRec=null, deferredPrompt=null;
const MODELS=['openai/gpt-oss-20b','openai/gpt-oss-120b','llama-3.1-8b-instant','llama-3.3-70b-versatile'];
const INTRO="Hey, I'm MA — Mzansi Assistance. How can I help you? 😊";

const UI={
 en:{ph:"Ask MA anything...",label:"ENGLISH",intro:INTRO,sys:"You are MA - Mzansi Assistance, created by Mulweli Phaswana in Greenview, Limpopo. You are friendly, helpful, concise, proudly South African. You know all languages including Tshivenda. Never repeat user. Built from dust, powered by dreams. Answer smart."},
 ve:{ph:"Vhudzisani MA tshiṅwe na tshiṅwe...",label:"TSHIVENDA",intro:INTRO,sys:"You are MA, answer primarily in Tshivenda, friendly, helpful. Created by Mulweli Phaswana."},
 zu:{ph:"Buza u-MA noma yini...",label:"ISIZULU",intro:INTRO,sys:"You are MA, answer in IsiZulu, friendly."},
 xh:{ph:"Buza u-MA nantoni...",label:"ISIXHOSA",intro:INTRO,sys:"Answer in IsiXhosa."},
 st:{ph:"Botsa MA eng kapa eng...",label:"SESOTHO",intro:INTRO,sys:"Answer in Sesotho."}
};

function saveKey(){let k=document.getElementById('apiKey').value.trim();if(!k.startsWith('gsk_')){document.getElementById('apiMsg').innerHTML='❌ Key must start with gsk_';return;}localStorage.setItem('groq_key',k);document.getElementById('apiMsg').innerHTML='✅ Saved! Super Brain Connected!';updateStatus();}
function removeKey(){localStorage.removeItem('groq_key');document.getElementById('apiKey').value='';document.getElementById('apiMsg').innerHTML='❌ Removed - Back to Local Brain';updateStatus();}
function toggleApiBox(){let b=document.getElementById('apiBox');b.style.display=b.style.display==='none'?'block':'none';}
function updateStatus(){let has=!!localStorage.getItem('groq_key');let dot=document.getElementById('dot');let txt=document.getElementById('statusText');dot.className='statusDot '+(has?'online':'offline');txt.textContent=has?'Super Brain (Groq) Connected':'Local Brain';if(has) document.getElementById('apiBox').style.display='none';}
async function testBrain(){let key=localStorage.getItem('groq_key');if(!key){document.getElementById('apiMsg').textContent='❌ No key saved';return;}document.getElementById('apiMsg').textContent='⏳ Testing models...';for(let m of MODELS){try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:m,messages:[{role:'user',content:'hi'}],max_tokens:5})});let j=await r.json();if(j.choices){document.getElementById('apiMsg').textContent='✅ Works perfect: '+m;return;}}catch(e){}}document.getElementById('apiMsg').textContent='❌ Key invalid or rate limited';}
async function askWithGroq(q){let key=localStorage.getItem('groq_key');if(!key) return null;let sys=UI[lang]?.sys||UI.en.sys;for(let model of MODELS){try{let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:q}],temperature:0.7,max_tokens:800})});let data=await res.json();if(data.choices&&data.choices[0]) return data.choices[0].message.content;}catch(e){continue;}}return null;}
function addMsg(t,c){let ch=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+c;d.textContent=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight+200;if(c==='bot') lastBot=t;}
function clearChat(){document.getElementById('chat').innerHTML='';addMsg(INTRO,'bot');}
function shareApp(){if(navigator.share){navigator.share({title:'MA • Mzansi Assistance',text:'Built From Dust, Powered By Dreams - Try MA!',url:location.href});}else{addMsg(location.href,'bot');navigator.clipboard.writeText(location.href);}}
function toggleWake(){if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){addMsg('Voice not supported on this browser bruh - use Chrome!','bot');return;}heyOn=!heyOn;let btn=document.getElementById('wakeBtn');if(heyOn){btn.textContent='🛑 STOP LISTENING';startWake();}else{btn.textContent='🎤 HEY MA';if(wakeRec) wakeRec.stop();}}
function startWake(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;wakeRec=new SR();wakeRec.continuous=true;wakeRec.lang='en-ZA';wakeRec.onresult=(e)=>{let txt=e.results[e.results.length-1][0].transcript.toLowerCase();if(txt.includes('hey ma')||txt.includes('hey em a')){let q=txt.split('hey ma').pop().trim()||txt;if(q){document.getElementById('q').value=q;ask();}}};wakeRec.onend=()=>{if(heyOn) wakeRec.start();};wakeRec.start();}
async function ask(){let inp=document.getElementById('q');let q=inp.value.trim();if(!q) return;if(q===lastBot){addMsg("Bruh you just repeated me 😅 Ask something new!",'bot');return;}addMsg(q,'user');inp.value='';let thinking=document.createElement('div');thinking.className='msg bot';thinking.textContent='MA thinking... 🧠';thinking.id='thinking';document.getElementById('chat').appendChild(thinking);document.getElementById('chat').scrollTop+=200;let ans=null;if(localStorage.getItem('groq_key')) ans=await askWithGroq(q);if(!ans){if(q.toLowerCase().includes('who are you')||q.toLowerCase().includes('who is ma')) ans=INTRO+"\n\nI'm built by Mulweli Phaswana - Kasi Boy From Greenview, Limpopo. Built From Dust, Powered By Dreams!";else ans="Sharp! I'm MA - Mzansi Assistance! I'm here to help you with anything - ask me in English, Tshivenda, Zulu, anything! Connect your free Groq brain for super power!";}document.getElementById('thinking')?.remove();addMsg(ans,'bot');if('speechSynthesis' in window && heyOn){let u=new SpeechSynthesisUtterance(ans.slice(0,200));speechSynthesis.speak(u);}}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key==='Enter') ask();});
document.getElementById('lang').addEventListener('change',()=>{lang=document.getElementById('lang').value;let l=UI[lang]||UI.en;document.getElementById('q').placeholder=l.ph;document.getElementById('langLabel').textContent=l.label;});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();let c=await deferredPrompt.userChoice;deferredPrompt=null;}else{addMsg('To install: Tap browser menu (⋮) → Add to Home Screen / Install App','bot');}});
window.onload=()=>{updateStatus();setTimeout(()=>addMsg(INTRO,'bot'),600);let l=UI[lang];document.getElementById('q').placeholder=l.ph;};
</script>
</body>
</html>
