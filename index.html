<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MA - Mzansi AI</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;padding:20px}
#status{padding:10px;border-radius:10px;margin:10px;font-weight:bold}
.local{background:#ef4444}.super{background:#22c55e}
button{padding:12px 20px;margin:5px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
#mic{background:#3b82f6;font-size:20px} #speak{background:#8b5cf6}
#chat{background:#1e293b;padding:15px;border-radius:15px;min-height:200px;margin:15px 0;text-align:left}
input{width:80%;padding:12px;border-radius:10px;border:none}
</style>
</head>
<body>
<h1>🇿🇦 MA - Mzansi AI</h1>
<div id="status" class="local">🔴 Local Brain - Works Offline</div>
<div id="chat">Sawubona! I'm MA. Tap mic and talk to me!</div>

<input id="q" placeholder="Ask me anything...">
<button onclick="ask()">Ask</button><br>

<button id="mic" onclick="listen()">🎤 Talk</button>
<button id="speak" onclick="toggleVoice()">🔊 Voice: ON</button>
<button onclick="connectKey()">🧠 CONNECT AI BRAIN</button>

<script>
// ===== VOICE SETTINGS =====
let voiceOn = true;
let groqKey = localStorage.getItem('groq_key') || "";

// Shared brain - PUT YOUR KEY HERE IF YOU WANT ONE BRAIN FOR ALL
const SHARED_KEY = ""; // e.g. "gsk_...." - leave empty if you want users to add own

function getKey(){ return groqKey || SHARED_KEY; }

if(getKey()){
 document.getElementById('status').innerText="🟢 Super Brain Connected";
 document.getElementById('status').className="super";
}

function toggleVoice(){
 voiceOn=!voiceOn;
 document.getElementById('speak').innerText = voiceOn? "🔊 Voice: ON" : "🔇 Voice: OFF";
}

function speak(text){
 if(!voiceOn) return;
 speechSynthesis.cancel();
 let u = new SpeechSynthesisUtterance(text);
 u.lang="en-ZA";
 speechSynthesis.speak(u);
}

function listen(){
 const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
 rec.lang="en-ZA";
 rec.onstart=()=> document.getElementById('chat').innerHTML+="🎤 Listening...<br>";
 rec.onresult=(e)=>{
   let t=e.results[0][0].transcript;
   document.getElementById('q').value=t;
   ask();
 };
 rec.start();
}

function connectKey(){
 let k=prompt("Paste your Groq key (gsk_...):");
 if(k){ localStorage.setItem('groq_key',k); groqKey=k; location.reload(); }
}

// ===== LOCAL BRAIN (OFFLINE) =====
function localBrain(q){
 q=q.toLowerCase();
 if(q.includes("water")) return "Water is H2O, covers 71% of Earth, boils at 100°C.";
 if(q.includes("hello")||q.includes("sawubona")) return "Sawubona bhuti! Sharp! How can I help you?";
 if(q.includes("who are you")) return "I'm MA, Mzansi AI made for kasi! I can talk, listen, and work even offline!";
 if(q.includes("joke")) return "Why did the math book look sad? It had too many problems! 😂";
 return "Local Brain: I know water, hello, jokes, who are you. For ANYTHING else, connect Super Brain! 🧠";
}

// ===== MAIN ASK =====
async function ask(){
 let query=document.getElementById('q').value;
 if(!query) return;
 let chat=document.getElementById('chat');
 chat.innerHTML+=`<p><b>You:</b> ${query}</p>`;
 document.getElementById('q').value="";

 // Try Groq first
 let key=getKey();
 if(key){
   try{
     let res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
       method:"POST",
       headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
       body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"user",content:query}]})
     });
     let data=await res.json();
     let ans=data.choices[0].message.content;
     chat.innerHTML+=`<p><b>MA 🟢:</b> ${ans}</p>`;
     speak(ans);
     return;
   }catch(e){ console.log("Groq failed, fallback to local"); }
 }

 // Fallback to local
 let ans=localBrain(query);
 chat.innerHTML+=`<p><b>MA 🔴:</b> ${ans}</p>`;
 speak(ans);
}
</script>
</body>
</html>
