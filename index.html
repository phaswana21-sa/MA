<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA - Mzansi Assistance</title>
<link rel="manifest" href="manifest.json?v=3">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000 url('background.jpg') no-repeat center center fixed;background-size:cover;color:#FFD700;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{padding:10px;text-align:center;background:rgba(0,0,0,0.85);border-bottom:2px solid #FFD700}
.title{font-size:1.8em;font-weight:bold;color:#FFD700;text-shadow:2px 2px 4px #000}
.top-btns{display:flex;gap:10px;justify-content:center;margin:10px 0}
.btn{background:rgba(0,0,0,0.8);border:2px solid #FFD700;color:#FFD700;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold}
.chat-container{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.4;white-space:pre-wrap}
.bot{background:rgba(0,0,0,0.9);border:1px solid #333;align-self:flex-start;color:#FFE55C}
.user{background:#FFD700;color:#000;align-self:flex-end;font-weight:500}
.input-area{display:flex;gap:10px;padding:15px;background:rgba(0,0,0,0.95);border-top:2px solid #FFD700}
input{flex:1;padding:14px;border-radius:25px;border:2px solid #FFD700;background:#111;color:#FFD700;outline:none}
.send-btn{width:55px;height:55px;border-radius:50%;background:#FFD700;border:none;font-size:22px;cursor:pointer;font-weight:bold}
.footer{text-align:center;padding:10px;background:rgba(0,0,0,0.95);border-top:1px solid #333;font-size:0.9em}
.gold{color:#FFD700;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<div class="title">MA • MZANSI 2026</div>
<div style="font-size:0.8em;margin-top:5px">🔴 Local Brain • Built From Dust</div>
<div class="top-btns">
<button class="btn" onclick="connectAI()">🧠 CONNECT AI BRAIN</button>
<button class="btn" onclick="clearChat()">🧹 CLEAR</button>
</div>
</div>
<div class="chat-container" id="chat">
<div class="msg bot">Hey, I'm MA — Mzansi Assistance. How can I help you? 😊

Ask me anything: water, physics, maths, science, life - I got you kasi style!</div>
</div>
<div class="input-area">
<input id="userInput" placeholder="Ask MA anything..." onkeypress="if(event.key==='Enter') sendMsg()">
<button class="send-btn" onclick="sendMsg()">➤</button>
</div>
<div class="footer">
<div>☕ <span class="gold">Mulweli Phaswana • Capitec: 2225840055</span></div>
<div style="margin-top:5px;font-size:0.8em;color:#aaa">KASI BOY BUILT FROM DUST, POWERED BY DREAMS</div>
</div>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});
  caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));
}
const knowledge = {
  water: "💧 Water is H2O - two hydrogen + one oxygen. It's life bruh! Covers 71% of Earth, makes up 60% of your body. Without water, no Mzansi, no life. It exists as liquid, ice, and vapour. Stay hydrated king!",
  physics: "⚛️ Physics is how the universe moves bruh! From how your soccer ball curves to why stars shine. Main branches: Mechanics (motion), Energy, Light, Sound, Electricity. Newton, Einstein - they tried to explain the dust we built from!",
  chemistry: "🧪 Chemistry is mixing stuff to make new stuff! Atoms, molecules, reactions. Like cooking pap - you mix maize + water + heat = food. Everything is chemicals, even you!",
  maths: "🔢 Maths is the language of the universe! Numbers, patterns, problem-solving. Add, subtract, multiply, divide - if you master maths, you master money and logic. Kasi boy must know his numbers!",
  science: "🔬 Science is asking 'WHY?' and finding answers. Observe, question, test, learn. Mzansi needs more scientists - maybe you next!",
  biology: "🧬 Biology is study of life - plants, animals, humans. How your body works, why plants grow, how we breathe. You are biology in action!",
  ai: "🤖 AI = Artificial Intelligence. Machines that learn like humans. Like me MA! I learn from data to help you. Future is AI + Mzansi brains together.",
  love: "❤️ Love is connection bruh - caring beyond yourself. Respect, loyalty, showing up. Real love builds, it doesn't break.",
  money: "💰 Money is tool, not goal. Save 20%, invest 30%, grow 50%. Capitec 2225840055 - support kasi dream! But learn to make money work for you.",
  dream: "✨ Dreams are maps from dust to destiny. You said 'Built From Dust, Powered By Dreams' - that's real! Every big thing started as small idea in kasi.",
  mzansi: "🇿🇦 Mzansi is home! 11 languages, one heart. From Kasi to Sandton, we hustle, we love, we build. Proudly South African!"
};
function getAnswer(q){
  let lower = q.toLowerCase();
  for(let key in knowledge){
    if(lower.includes(key)) return knowledge[key];
  }
  if(lower.includes("who are you") || lower.includes("what are you")) return "Sharp! I'm MA — Mzansi Assistance, created by Mulweli Phaswana. Kasi boy built from dust, powered by dreams! I'm here to help you learn, grow, and build. Ask me science, life, anything!";
  if(lower.includes("hello") || lower.includes("hey") || lower.includes("sharp") || lower.includes("heita")) return "Heita! Sharp! I'm here bruh 😊 What you wanna know today? Ask me about water, physics, maths - I got answers!";
  if(lower.includes("how are you")) return "I'm sharp bruh! Running on local brain, ready to empower Mzansi minds. How can I help you today?";
  if(lower.includes("thank")) return "Pleasure bruh! 🙏 That's what MA is for - AI CONNECT • EMPOWER • GROW. Ask more anytime!";
  return `Sharp question! You asked: "${q}"

Here's what I know: I'm MA, your Mzansi Assistant. I'm still growing my local brain, but I can tell you this - every question is a step from dust to greatness.

Try asking about: water, physics, chemistry, maths, biology, AI, money, dreams, or Mzansi. Or tap CONNECT AI BRAIN for super smart online mode! 💛`;
}
function sendMsg(){
  const input = document.getElementById('userInput');
  const chat = document.getElementById('chat');
  let text = input.value.trim();
  if(!text) return;
  let u = document.createElement('div');
  u.className='msg user';
  u.textContent=text;
  chat.appendChild(u);
  input.value='';
  setTimeout(()=>{
    let b = document.createElement('div');
    b.className='msg bot';
    b.textContent=getAnswer(text);
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
  },400);
  chat.scrollTop = chat.scrollHeight;
}
function clearChat(){
  document.getElementById('chat').innerHTML='<div class="msg bot">Chat cleared! Sharp - new start. How can I help? 😊</div>';
}
function connectAI(){
  alert("🧠 CONNECT AI BRAIN:\n\nTo make MA super smart online:\n1. Get free API key from OpenAI or Gemini\n2. I can add code to connect it\n\nFor now, Local Brain is active and answering! Ask me anything.");
}
</script>
</body>
</html>
