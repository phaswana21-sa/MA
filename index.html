<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>MA • Mzansi Assistance 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--border:rgba(255,215,0,0.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(rgba(0,0,0,0.78),rgba(0,0,0,0.9)),url('background.jpg') no-repeat center center fixed;background-size:cover;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-family:'Space Grotesk';font-weight:700;letter-spacing:4px;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.6);margin-top:10px;font-size:26px}
.sub{font-family:'Space Grotesk';font-size:10px;letter-spacing:3px;color:var(--gold);opacity:0.8;margin:6px 0 12px}
.glass{background:rgba(20,20,20,0.88);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
.topbar{width:100%;max-width:430px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-family:'Space Grotesk';font-weight:600;font-size:12px;padding:11px 18px;border-radius:30px;border:none;cursor:pointer}
.gold{background:linear-gradient(135deg,#FFD700,#FFC300);color:#000}.dark{background:rgba(255,255,255,0.08);color:#FFD700;border:1px solid var(--border)}
.red{background:linear-gradient(135deg,#FF5252,#D32F2F);color:#fff}
select{width:100%;padding:12px 16px;border-radius:14px;background:rgba(0,0,0,0.6);color:#FFD700;border:1px solid var(--border);font-family:'Space Grotesk';font-weight:600;outline:none}
#chat{width:100%;max-width:430px;height:460px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;margin:8px 0}
.msg{max-width:86%;padding:13px 16px;border-radius:20px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:linear-gradient(135deg,#FFD700,#FFB300);color:#000;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:rgba(30,30,30,0.95);color:#FFE57F;border:1px solid rgba(255,215,0,0.2);border-bottom-left-radius:6px}
.inputBar{width:100%;max-width:430px;display:flex;gap:8px;align-items:center;padding:10px 12px;margin:6px 0}
#q{flex:1;padding:14px 18px;border-radius:28px;border:1px solid var(--border);background:rgba(15,15,15,0.9);color:#fff;outline:none;font-size:14px}
.iconBtn{width:48px;height:48px;border-radius:50%;border:none;display:grid;place-items:center;font-size:18px;cursor:pointer}
#apiBox{display:none;width:100%;margin-top:10px;padding:12px;border-radius:14px;background:rgba(0,0,0,0.7);border:1px dashed #FFD700}
#apiBox input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#111;color:#fff;margin:6px 0}
.statusDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.online{background:#00E676}.offline{background:#FF5252}
</style>
</head>
<body>
<h1>MA • MZANSI</h1>
<div class="sub">BUILT FROM DUST • POWERED BY DREAMS • 2026</div>
<div class="topbar glass">
<div style="display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.7)"><span><span id="dot" class="statusDot offline"></span><span id="statusText">Local Brain</span></span><span id="langLabel">ENGLISH</span></div>
<select id="lang"><option value="en">🌍 English</option><option value="ve">Tshivenda</option><option value="zu">IsiZulu</option><option value="st">Sesotho</option><option value="xh">IsiXhosa</option><option value="ts">Xitsonga</option></select>
<div class="row"><button class="btn gold" id="installBtn">⬇️ INSTALL APP</button><button class="btn dark" onclick="shareApp()">📤 SHARE</button><button class="btn red" id="wakeBtn" onclick="toggleWake()">🎤 HEY MA</button></div>
<div class="row"><button class="btn dark" onclick="toggleApiBox()">🧠 CONNECT AI BRAIN</button><button class="btn dark" onclick="clearChat()">🧹 CLEAR</button></div>
<div id="apiBox"><div style="font-size:12px;color:#FFD700;font-weight:600">Add FREE Groq Key - makes MA super smart</div><div style="font-size:10px;color:#aaa">groq.com → API Keys → Create → Paste gsk_...</div><input id="apiKey" type="password" placeholder="gsk_... paste here"><div class="row"><button class="btn gold" onclick="saveKey()">💾 SAVE</button><button class="btn dark" onclick="testBrain()">🧪 TEST</button><button class="btn dark" onclick="removeKey()">❌ REMOVE</button></div><div id="apiMsg" style="font-size:11px;color:#00E676;margin-top:6px"></div></div>
</div>
<div id="chat" class="glass"></div>
<div class="inputBar glass"><input id="q" placeholder="Ask MA anything..."><button class="btn gold iconBtn" onclick="ask()">➤</button><button class="btn dark iconBtn" onclick="speakLast()">🔊</button></div>
<div class="topbar glass" style="text-align:center;margin:10px 0"><div style="color:#FFD700;font-weight:700;font-size:13px">☕ SUPPORT FOUNDER</div><div style="font-size:12px;color:#ccc">Mulweli Phaswana • Nzhelele</div><div style="color:#FFD700;font-weight:700;font-size:16px">Capitec: 2225840055</div></div>
<script>
let lang='en',lastBot='',heyOn=false,wakeRec=null,deferredPrompt=null;
const UI={
 en:{ph:"Ask MA anything...",intro:"Hey, I'm MA — Mzansi Assistance. How can I assist you today? 😊",sys:"You are MA, Mzansi Assistance, built by Mulweli Phaswana from Nzhelele. Friendly, concise, helpful. Never repeat user question. Founder: Mulweli Phaswana - Built From Dust, Powered By Dreams."},
 ve:{ph:"Vhudzisani MA...",intro:"Hey, I'm MA — How can I assist you today? 😊 (Amba nga Tshivenda)",sys:"You are MA, answer in Tshivenda. Friendly, concise."},
 zu:{ph:"Buza u-MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"You are MA, answer in IsiZulu."},
 st:{ph:"Botsa MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"You are MA, answer in Sesotho."},
 xh:{ph:"Buza u-MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"You are MA, answer in IsiXhosa."},
 ts:{ph:"Vutisa MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"You are MA, answer in Xitsonga."}
};
function saveKey(){let k=document.getElementById('apiKey').value.trim();if(!k.startsWith('gsk_')){document.getElementById('apiMsg').textContent='❌ Must start with gsk_';return;}localStorage.setItem('groq_key',k);document.getElementById('apiMsg').textContent='✅ Brain Connected!';updateStatus();document.getElementById('apiKey').value='';}
function removeKey(){localStorage.removeItem('groq_key');document.getElementById('apiMsg').textContent='Removed - local brain';updateStatus();}
function toggleApiBox(){let b=document.getElementById('apiBox');b.style.display=b.style.display=='none'?'block':'none';}
function updateStatus(){let has=!!localStorage.getItem('groq_key');document.getElementById('dot').className='statusDot '+(has?'online':'offline');document.getElementById('statusText').textContent=has?'Super Brain Connected':'Local Smart Brain';}
async function testBrain(){let k=localStorage.getItem('groq_key');if(!k){document.getElementById('apiMsg').textContent='Add key first';return;}document.getElementById('apiMsg').textContent='Testing...';try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:'Say hi, I am MA'}],max_tokens:20})});let j=await r.json();if(j.choices) document.getElementById('apiMsg').textContent='✅ Test OK: '+j.choices[0].message.content.slice(0,50);else document.getElementById('apiMsg').textContent='❌ '+(j.error?.message||'Failed');}catch(e){document.getElementById('apiMsg').textContent='❌ '+e.message;}}
function localBrain(q){q=q.toLowerCase();if(q.match(/mudini|holwiwa|emergency/)) return "🆘 Emergency: Police 10111 / 112, Ambulance 10177";if(q.match(/police|mapholisa/)) return "🚨 Police: 10111, 112";if(q.match(/who are you|mulweli/)) return "I'm MA, built by Mulweli Phaswana - Built From Dust! 🔥";return null;}
async function askWithGroq(q){let key=localStorage.getItem('groq_key');if(!key) return null;try{let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:UI[lang].sys},{role:'user',content:q}],temperature:0.7,max_tokens:600})});let data=await res.json();if(data.choices) return data.choices[0].message.content;else throw new Error(data.error?.message);}catch(e){return "⚠️ Brain error: "+e.message;}}
function addMsg(t,c){let ch=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+c;d.textContent=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight+200;if(c=='bot') lastBot=t;}
function clearChat(){document.getElementById('chat').innerHTML='';addMsg(UI[lang].intro,'bot');}
function changeLang(){lang=document.getElementById('lang').value;document.getElementById('langLabel').textContent=lang.toUpperCase();document.getElementById('q').placeholder=UI[lang].ph;addMsg("✅ "+lang.toUpperCase()+" - "+UI[lang].intro,'bot');}
document.getElementById('lang').addEventListener('change',changeLang);
function shareApp(){if(navigator.share) navigator.share({title:'MA',url:location.href});else{addMsg("Link: "+location.href,'bot');}}
function speak(text){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[^\w\s\.,!?:]/g,''));u.lang='en-ZA';u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
function speakLast(){if(lastBot) speak(lastBot);}
function toggleWake(){heyOn=!heyOn;let b=document.getElementById('wakeBtn');if(heyOn){b.textContent='🛑 STOP';startWake();addMsg("🎤 Listening...","bot");}else{b.textContent='🎤 HEY MA';if(wakeRec) try{wakeRec.stop();}catch(e){}}}
function startWake(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR) return;let rec=new SR();wakeRec=rec;rec.lang='en-ZA';rec.continuous=false;try{rec.start();}catch(e){}rec.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;ask();};rec.onend=()=>{if(heyOn) setTimeout(()=>startWake(),800);}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}else{addMsg("Install: Chrome menu → Add to Home Screen 📲","bot");}});
async function ask(){let inp=document.getElementById('q');let q=inp.value.trim();if(!q) return;addMsg(q,'user');inp.value='';let th=document.createElement('div');th.className='msg bot';th.textContent='MA thinking...';th.id='thinking';document.getElementById('chat').appendChild(th);let ans=null;if(localStorage.getItem('groq_key')) ans=await askWithGroq(q);if(!ans){let l=localBrain(q);ans=l||"Got you! Add brain for super smart answers. What do you need?";}document.getElementById('thinking')?.remove();addMsg(ans,'bot');speak(ans);}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key=='Enter') ask();});
window.onload=()=>{updateStatus();setTimeout(()=>addMsg("Hey, I'm MA — Mzansi Assistance. How can I assist you today? 😊\n\nNo repeating! Add free brain in 'CONNECT AI BRAIN'.",'bot'),600);};
</script>
</body>
</html>
