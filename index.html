<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MA • Mzansi Assistance</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--border:rgba(255,215,0,0.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.92)),url('background.jpg') center/cover fixed;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-family:'Space Grotesk';letter-spacing:4px;color:var(--gold);text-shadow:0 0 20px gold;margin-top:10px}
.glass{background:rgba(20,20,20,0.88);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px}
.topbar{width:100%;max-width:430px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-weight:600;font-size:12px;padding:11px 18px;border-radius:30px;border:none;cursor:pointer}
.gold{background:linear-gradient(135deg,#FFD700,#FFC300);color:#000}.dark{background:rgba(255,255,255,0.08);color:#FFD700;border:1px solid var(--border)}.red{background:#D32F2F;color:#fff}
select{width:100%;padding:12px;border-radius:14px;background:#111;color:gold;border:1px solid var(--border);font-weight:600}
#chat{width:100%;max-width:430px;height:460px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;margin:8px 0}
.msg{max-width:86%;padding:13px 16px;border-radius:20px;font-size:14px;white-space:pre-wrap}
.user{align-self:flex-end;background:gold;color:#000;border-bottom-right-radius:6px}.bot{align-self:flex-start;background:#1e1e1e;color:#FFE57F;border:1px solid rgba(255,215,0,0.2);border-bottom-left-radius:6px}
.inputBar{width:100%;max-width:430px;display:flex;gap:8px;padding:10px 12px;margin:6px 0}
#q{flex:1;padding:14px 18px;border-radius:28px;border:1px solid var(--border);background:#111;color:#fff;outline:none}
#apiBox{display:none;width:100%;padding:12px;border-radius:14px;background:rgba(0,0,0,0.7);border:1px dashed gold}
#apiBox input{width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid var(--border);margin:6px 0}
.statusDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.online{background:#00E676}.offline{background:#FF5252}
</style>
</head>
<body>
<h1>MA • MZANSI</h1>
<div style="font-size:10px;letter-spacing:3px;color:gold;opacity:0.8;margin-bottom:12px">BUILT FROM DUST • POWERED BY DREAMS</div>
<div class="topbar glass">
<div style="display:flex;justify-content:space-between;font-size:11px"><span><span id="dot" class="statusDot offline"></span><span id="statusText">Local Brain</span></span><span>ENGLISH</span></div>
<select id="lang"><option value="en">🌍 English</option><option value="ve">Tshivenda</option><option value="zu">IsiZulu</option><option value="st">Sesotho</option><option value="xh">IsiXhosa</option><option value="ts">Xitsonga</option></select>
<div class="row"><button class="btn gold" id="installBtn">⬇️ INSTALL</button><button class="btn dark" onclick="shareApp()">📤 SHARE</button><button class="btn red" id="wakeBtn" onclick="toggleWake()">🎤 HEY MA</button></div>
<div class="row"><button class="btn dark" onclick="toggleApiBox()">🧠 CONNECT BRAIN</button><button class="btn dark" onclick="clearChat()">🧹 CLEAR</button></div>
<div id="apiBox"><div style="color:gold;font-weight:600;font-size:12px">Paste FREE Groq Key (gsk_...)</div><input id="apiKey" type="password" placeholder="gsk_..."><div class="row"><button class="btn gold" onclick="saveKey()">💾 SAVE</button><button class="btn dark" onclick="testBrain()">🧪 TEST</button><button class="btn dark" onclick="removeKey()">❌ REMOVE</button></div><div id="apiMsg" style="font-size:11px;color:#00E676;margin-top:6px"></div></div>
</div>
<div id="chat" class="glass"></div>
<div class="inputBar glass"><input id="q" placeholder="Ask MA anything..."><button class="btn gold" style="border-radius:50%;width:48px;height:48px" onclick="ask()">➤</button></div>
<div class="topbar glass" style="text-align:center;margin:10px"><div style="color:gold;font-weight:700">☕ Mulweli Phaswana</div><div style="color:gold;font-size:16px;font-weight:700">Capitec: 2225840055</div></div>
<script>
let lang='en',lastBot='',heyOn=false,wakeRec=null,deferredPrompt=null;
const MODELS=['openai/gpt-oss-20b','openai/gpt-oss-120b','llama-3.1-8b-instant'];
const UI={
 en:{ph:"Ask MA anything...",intro:"Hey, I'm MA — Mzansi Assistance. How can I assist you today? 😊",sys:"You are MA, Mzansi Assistance, built by Mulweli Phaswana from Nzhelele. Friendly, helpful, concise. Never repeat user. Founder: Mulweli - Built From Dust."},
 ve:{ph:"Vhudzisani MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"You are MA, answer in Tshivenda. Friendly."},
 zu:{ph:"Buza u-MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"Answer in IsiZulu."},
 st:{ph:"Botsa MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"Answer in Sesotho."},
 xh:{ph:"Buza u-MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"Answer in IsiXhosa."},
 ts:{ph:"Vutisa MA...",intro:"Hey, I'm MA — How can I assist you today? 😊",sys:"Answer in Xitsonga."}
};
function saveKey(){let k=document.getElementById('apiKey').value.trim();if(!k.startsWith('gsk_')){document.getElementById('apiMsg').textContent='❌ Must start gsk_';return;}localStorage.setItem('groq_key',k);document.getElementById('apiMsg').textContent='✅ Saved!';updateStatus();document.getElementById('apiKey').value='';}
function removeKey(){localStorage.removeItem('groq_key');document.getElementById('apiMsg').textContent='Removed';updateStatus();}
function toggleApiBox(){let b=document.getElementById('apiBox');b.style.display=b.style.display=='none'?'block':'none';}
function updateStatus(){let h=!!localStorage.getItem('groq_key');document.getElementById('dot').className='statusDot '+(h?'online':'offline');document.getElementById('statusText').textContent=h?'Super Brain Connected':'Local Brain';}
async function testBrain(){let k=localStorage.getItem('groq_key');if(!k){document.getElementById('apiMsg').textContent='Add key';return;}document.getElementById('apiMsg').textContent='Testing...';for(let m of MODELS){try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({model:m,messages:[{role:'user',content:'hi'}],max_tokens:10})});let j=await r.json();if(j.choices){document.getElementById('apiMsg').textContent='✅ Works with: '+m;return;}else{document.getElementById('apiMsg').textContent='Trying next... '+m+' failed';}}catch(e){continue;}}document.getElementById('apiMsg').textContent='❌ All models failed - check key';}
async function askWithGroq(q){let key=localStorage.getItem('groq_key');if(!key) return null;for(let model of MODELS){try{let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:model,messages:[{role:'system',content:UI[lang].sys},{role:'user',content:q}],temperature:0.7,max_tokens:600})});let data=await res.json();if(data.choices && data.choices[0]) return data.choices[0].message.content; }catch(e){continue;}}return "⚠️ All Groq models busy, try again. Using local brain.";}
function addMsg(t,c){let ch=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+c;d.textContent=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight+200;if(c=='bot') lastBot=t;}
function clearChat(){document.getElementById('chat').innerHTML='';addMsg(UI[lang].intro,'bot');}
function changeLang(){lang=document.getElementById('lang').value;document.getElementById('q').placeholder=UI[lang].ph;addMsg("✅ "+lang.toUpperCase()+" - "+UI[lang].intro,'bot');}
document.getElementById('lang').addEventListener('change',changeLang);
function shareApp(){if(navigator.share) navigator.share({title:'MA',url:location.href});else addMsg(location.href,'bot');}
function toggleWake(){heyOn=!heyOn;let b=document.getElementById('wakeBtn');if(heyOn){b.textContent='🛑 STOP';startWake();}else{b.textContent='🎤 HEY MA';if(wakeRec) try{wakeRec.stop();}catch(e){}}}
function startWake(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR) return;let rec=new SR();wakeRec=rec;rec.lang='en-ZA';rec.continuous=false;try{rec.start();}catch(e){}rec.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;ask();};rec.onend=()=>{if(heyOn) setTimeout(()=>startWake(),800);}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}else{addMsg("Chrome menu → Add to Home Screen 📲",'bot');}});
async function ask(){let inp=document.getElementById('q');let q=inp.value.trim();if(!q) return;addMsg(q,'user');inp.value='';let th=document.createElement('div');th.className='msg bot';th.textContent='MA thinking...';th.id='thinking';document.getElementById('chat').appendChild(th);let ans=null;if(localStorage.getItem('groq_key')) ans=await askWithGroq(q);if(!ans) ans="Got you! I'm here to help. Add Groq brain for ChatGPT power, or ask emergency, culture, tech.";document.getElementById('thinking')?.remove();addMsg(ans,'bot');}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key=='Enter') ask();});
window.onload=()=>{updateStatus();setTimeout(()=>addMsg("Hey, I'm MA — Mzansi Assistance. How can I assist you today? 😊\n\nNo repeating! Super Brain ready!",'bot'),600);};
</script>
</body>
</html>
